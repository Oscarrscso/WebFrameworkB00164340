{% extends "base.html" %}

{% block content %}
{% if sorted_catalog %}

<h2>Products:</h2>

<dl style="margin-left:10px">
{% for item in sorted_catalog %}
    <dt style="font-size:large"><a href="/catalog/{{ item.item_name }}/">{{ item.item_name }}</a></dt>
        <dd><p style="color:darkgrey"> €{{item.item_price}}</p></dd>
    <br>
{% endfor %}
</dl>


{% else %}
    <p>No items are available.</p>
{% endif %}
{% endblock %}
